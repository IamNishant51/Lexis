name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (CPU-only, no GGUF download)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff, blocking)
        run: ruff check lexis_local tests benchmarks scripts

      - name: Format (black, blocking)
        run: black --check lexis_local tests benchmarks scripts

      - name: Tests (mock mode, no model download)
        run: pytest -q

      - name: Benchmark smoke (sub-100ms contract)
        run: python benchmarks/benchmark.py --requests 10
